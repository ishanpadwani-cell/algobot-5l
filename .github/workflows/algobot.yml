name: AlgoBot 5L Auto-Pilot

on:
  schedule:
    # 03:00 UTC = 8:30 AM IST daily (Shift 1 on trading days | Self-Train + Audit on holidays/weekends)
    - cron: '0 3 * * *'
    # 06:45 UTC = 12:15 PM IST Mon-Fri (Shift 2 through 3:30 PM close + EOD summary)
    - cron: '45 6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Manual run mode'
        required: true
        default: 'live_once'
        type: choice
        options:
          - live_once
          - train_and_audit
          - shift_1
          - shift_2

permissions:
  contents: write

concurrency:
  group: algobot-wallet-lock
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 255

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AlgoBot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.mode }}" = "train_and_audit" ]; then
              python train_and_audit.py
            elif [ "${{ inputs.mode }}" = "shift_1" ]; then
              python live_bot.py --shift 1
            elif [ "${{ inputs.mode }}" = "shift_2" ]; then
              python live_bot.py --shift 2
            else
              python live_bot.py --once
            fi
          elif [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            python live_bot.py --shift 1
          else
            python live_bot.py --shift 2
          fi

      - name: Final safety sync to GitHub
        if: always()
        run: |
          git config user.name "AlgoBot AutoPilot"
          git config user.email "algobot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || (git commit -m "AutoBot state sync" && git pull --rebase --autostash && git push)
